<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiaMart Lead Autoclick</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-icon">⚡</div>
        <div>
          <h1 class="app-title">Lead Autoclick</h1>
          <div class="app-subtitle">INDIAMART BOT <span class="version-badge">PRO</span></div>
        </div>
      </div>
      <button id="open-dashboard-btn" class="icon-btn" title="Open Full Dashboard">⚙️</button>
    </header>

    <!-- Clicks Today Card -->
    <div class="stat-card">
      <div class="stat-header">
        <span class="stat-label">Clicks Today</span>
        <span class="stat-reset">Resets at midnight</span>
      </div>
      <div class="stat-value-row">
        <span class="stat-number" id="clicks-today-count">0</span>
        <span class="stat-subtext" id="clicks-limit-subtext">/ Unlimited clicks</span>
      </div>
      <div class="stat-total" id="total-clicks-count">0 total all-time</div>
    </div>

    <!-- Engine Toggle Switch -->
    <div class="control-box">
      <div class="control-row">
        <div>
          <div class="control-title">Auto-Click Engine</div>
          <div class="control-desc" id="engine-status-text">Engine Paused</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="engine-toggle">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="divider"></div>

      <!-- Quick Toggles -->
      <div class="toggle-option">
        <label for="sound-toggle">Sound when a lead is picked</label>
        <input type="checkbox" id="sound-toggle" checked>
      </div>

      <div class="toggle-option">
        <label for="autorefresh-toggle">Auto-Refresh seller page</label>
        <input type="checkbox" id="autorefresh-toggle" checked>
      </div>

      <div class="input-option" id="refresh-interval-row">
        <label for="refresh-interval-input">Refresh every (seconds):</label>
        <input type="number" id="refresh-interval-input" min="3" max="300" value="15">
      </div>

      <div class="toggle-option">
        <label for="onscreen-timer-toggle">On-screen floating timer HUD</label>
        <input type="checkbox" id="onscreen-timer-toggle" checked>
      </div>
    </div>

    <!-- Quick Keywords Section -->
    <div class="section-container">
      <div class="section-header">
        <span class="section-title">Keywords (<span id="keyword-count">0</span>)</span>
        <button id="quick-add-kw-btn" class="btn-text">+ Add</button>
      </div>

      <div id="quick-add-form" class="quick-add-box hidden">
        <input type="text" id="new-kw-input" placeholder="e.g. Electric Forklift" class="input-text">
        <button id="save-new-kw-btn" class="btn-primary-sm">Save</button>
      </div>

      <div id="keywords-list" class="keywords-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="action-footer">
      <button id="scan-now-btn" class="btn-secondary">
        🔍 Scan Page Now
      </button>
      <button id="full-dashboard-btn" class="btn-primary">
        🚀 Open Advanced Rules Dashboard
      </button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
